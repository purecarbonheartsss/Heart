name: Build Carbon Heart
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload UI Executable
        uses: actions/upload-artifact@v4
        with:
          name: CarbonHeart-UI
          path: build/Release/CarbonHeart.exe
          if-no-files-found: error
      - name: Upload Execution DLL
        uses: actions/upload-artifact@v4
        with:
          name: CarbonHeart-DLL
          path: build/Release/CarbonHeartDLL.dll
          if-no-files-found: error
